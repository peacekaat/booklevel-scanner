<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BookLevel Scanner</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:720px;margin:auto;padding:20px;line-height:1.4}
    h1{margin-bottom:6px}.muted{color:#666}
    button,input{font:inherit;padding:12px;border-radius:10px;border:1px solid #bbb}
    button{cursor:pointer}.row{display:flex;gap:8px;flex-wrap:wrap}
    input{flex:1;min-width:220px}.card{margin-top:18px;padding:16px;border:1px solid #ddd;border-radius:14px}
    video{width:100%;max-height:55vh;border-radius:14px;background:#111;margin-top:12px}
    #error{color:#b00020;margin-top:12px}
    #result{display:none}
  </style>
</head>
<body>
  <h1>📚 BookLevel Scanner</h1>
  <p class="muted">Scan an ISBN or enter it manually.</p>

  <div class="row">
    <button id="scan">Scan ISBN</button>
    <button id="stop" hidden>Stop camera</button>
  </div>

  <video id="video" playsinline autoplay muted style="display:none"></video>

  <div class="card">
    <div class="row">
      <input id="isbn" inputmode="numeric" placeholder="ISBN-10 or ISBN-13">
      <button id="lookup">Look up ISBN</button>
    </div>
    <div id="error"></div>
  </div>

  <div id="result" class="card">
    <h2 id="title"></h2>
    <p><strong>Author:</strong> <span id="author"></span></p>
    <p><strong>ISBN:</strong> <span id="isbnOut"></span></p>
    <p id="edition"></p>
    <p><strong>AR:</strong> <span id="ar">Not verified yet</span></p>
    <p><strong>Lexile:</strong> <span id="lexile">Not verified yet</span></p>
    <button id="again">Scan another book</button>
  </div>

  <script type="module" src="./script.js"></script>
</body>
</html>
